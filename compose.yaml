name: tablemint

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tablemint
      POSTGRES_USER: tablemint
      POSTGRES_PASSWORD: tablemint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablemint -d tablemint"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tablemint-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=tablemint;Username=tablemint;Password=tablemint
      Database__ApplyMigrationsOnStartup: "true"
      SeedData__Enabled: "true"
    ports:
      - "8080:8080"

volumes:
  tablemint-postgres:
